name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (sin API; RQ-17/RQ-25 quedan fuera)
        run: python -m pytest tests -m "not rendimiento and not evals" --cov=atribucion --cov=metricas_decision
