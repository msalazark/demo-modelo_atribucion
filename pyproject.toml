[project]
name = "demo-modelo-atribucion"
version = "0.1.0"
description = "Modelo de atribución data-driven para ecommerce: rutas de conversión, modelos (reglas, Markov, Shapley), dashboard e intérprete con Claude."
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "streamlit==1.66.0",
    "altair==6.3.0",
    "anthropic==1.15.0",
    "structlog==26.1.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "pytz==2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rendimiento: pruebas de carga con datos sintéticos grandes (RQ-17, no corren en CI por defecto)",
    "evals: pruebas del intérprete que gastan API de Claude (RQ-25, no corren en CI por defecto)",
]
# `pytest tests` a secas no gasta API ni corre las pruebas de carga (CLAUDE.md lo documenta así);
# para correrlas a propósito: `pytest tests -m rendimiento` o `pytest tests -m evals`.
addopts = "-m \"not rendimiento and not evals\""

[tool.coverage.run]
source = ["atribucion", "metricas_decision"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Modo básico (RQ-26): correctitud, imports e idioms modernos. E501 (largo de línea) queda fuera
# porque el estilo actual del repo ya excede 120 en varias consultas SQL inline; adoptarlo
# implicaría reformatear archivos que este RQ no toca.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
